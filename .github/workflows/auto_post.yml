name: Ameba Auto Post Scheduler

on:
  schedule:
    # 1時間ごとに実行 (UTC時間 毎時0分)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub画面から手動実行可能にするボタン

jobs:
  auto-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Playwrightブラウザ（Chromium）のインストール
        run: npx playwright install chromium

      - name: Ameba自動投稿の実行
        env:
          AMEBA_ID: ${{ secrets.AMEBA_ID }}
          AMEBA_PASSWORD: ${{ secrets.AMEBA_PASSWORD }}
          AMEBA_COOKIES: ${{ secrets.AMEBA_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node auto_post.js

      - name: 投稿履歴（posted_items.json / used_keywords.json）の保存・コミット
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_items.json used_keywords.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted items and keywords [skip ci]" && git push)
